name: Poll ADS-B snapshots

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adsb-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Poll regions and append snapshots
        run: python scripts/poll.py

      - name: Commit new snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/snapshots
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "ADS-B snapshots $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
